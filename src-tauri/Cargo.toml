[package]
name = "gamelife"
version = "0.1.0"
edition = "2021"

[lib]
name = "gamelife_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "gamelife"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
gamelife-core = { path = "../crates/gamelife-core" }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
