<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GameLife</title>
    <script>
      // Pre-paint theme: resolve before first paint so a dark window never
      // flashes light while config.json is still loading. Mirrors
      // src/lib/theme.ts — the cached value wins over the system default.
      (function () {
        try {
          var cached = localStorage.getItem("gl-theme");
          var accent = localStorage.getItem("gl-accent");
          var bg = localStorage.getItem("gl-prepaint-bg");
          var dark =
            cached === "dark" ||
            (cached !== "light" &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          if (dark) document.documentElement.classList.add("dark");
          if (accent) document.documentElement.setAttribute("data-accent", accent);
          document.documentElement.style.backgroundColor =
            bg || (dark ? "hsl(220.0 1.4% 10.0%)" : "hsl(220.0 2.9% 98.0%)");
        } catch (e) {
          /* storage unavailable — the app applies the theme once settings load */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
